<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Băuturi pe categorii</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE work
   IDEA a newspaper graphics-desk inventory sheet
   PICTURE horizontal bars of pieces per category, each bar linking to its list
   COLOUR pale pink ground, ink, teal bars, claret accent on the largest
   TYPE Libre Franklin 800 + Libre Franklin
   LAYOUT title + total top, bar chart full width, then category cards in two columns (one on phone) */
:root{color-scheme:light dark;--bg:light-dark(#ffe3dc,#1c1512);--card:light-dark(#fff4f0,#261d19);--ink:light-dark(#1a1817,#f3ebe7);--mu:light-dark(#6a5a55,#b8a9a3);--ln:light-dark(#efc9bf,#3a2d28);--teal:light-dark(#0d7680,#4fb3bc);--cla:light-dark(#990f3d,#e0507f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Libre Franklin",system-ui,sans-serif;overflow-x:clip}
.band{max-width:1100px;margin:0 auto;padding-block:clamp(24px,4vw,48px);padding-left:max(5vw,16px,env(safe-area-inset-left,0px));padding-right:max(5vw,16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:20px}
h1{font-weight:800;font-size:clamp(32px,5vw,46px);line-height:1.05;letter-spacing:-.02em;margin:0}
.lead{margin:6px 0 0;color:var(--mu);font-size:16px}
.big{text-align:right}
.big b{display:block;font-weight:800;font-size:clamp(40px,6vw,60px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big span{color:var(--mu);font-size:14px}
.bars{display:grid;grid-template-columns:max-content minmax(0,1fr) max-content;gap:6px 12px;align-items:center;margin-bottom:28px}
.bars a{color:var(--ink);text-decoration:none;font-size:15px;white-space:nowrap}
.bars a:hover{text-decoration:underline}
.bar{height:18px;background:var(--teal);border-radius:2px}
.bar.top1{background:var(--cla)}
.num{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cat{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:14px 16px;scroll-margin-top:12px}
.cat h2{display:flex;justify-content:space-between;gap:12px;font-size:19px;font-weight:800;margin:0 0 8px;letter-spacing:-.01em;border-bottom:1px solid var(--ln);padding-bottom:6px}
.cat h2 span{color:var(--teal);font-variant-numeric:tabular-nums;white-space:nowrap}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:8px;padding:5px 0;border-bottom:1px dashed var(--ln);font-size:15px}
li:last-child{border-bottom:0}
li b{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
li small{display:block;color:var(--mu);font-size:13px}
.foot{color:var(--mu);font-size:13px;margin-top:18px}
@media(max-width:700px){.grid{grid-template-columns:minmax(0,1fr)}.bars a{font-size:14px}}
@media(max-width:420px){.big{text-align:left}}
</style>
</head>
<body>
<div class="band">
<div class="top">
<div><h1>Băuturi pe categorii</h1><p class="lead"><span id="np"></span> produse în <span id="nc"></span> categorii</p></div>
<div class="big"><b id="tot"></b><span>bucăți în total</span></div>
</div>
<div class="bars" id="bars"></div>
<div class="grid" id="grid"></div>
<p class="foot">Fără cafea, sosuri, ulei și scutece. Lista din 28.11.2026.</p>
</div>

Cu Lamaie & Plante Aromatice Spirited Union 38% Alc. 0.7l", "q": 1, "cod": "ART_38741"}, {"n": "Rom Cu Portocale & Ginger Spirited Union Alc.38% 0.7l", "q": 1, "cod": "ART_38743"}, {"n": "Rom Spiced Ratu Alc. 40% 0.7l", "q": 1, "cod": "ART_38738"}, {"n": "Rom Tesoro Reserve Overproof Tanduay 50.5% Alc 0.7L", "q": 1, "cod": "ART_38260"}, {"n": "Rom Yellow Snake Jamaica Island Signature 40% Alc. 0.7l", "q": 1, "cod": "ART_35587"}]}, {"c": "Fără alcool", "id": "c10", "it": [{"n": "Vin Alb Fara Alcool Natureo Muscat Miguel Torres 0.75l", "q": 2, "cod": "ART_36148"}, {"n": "Vin Spumant Dezalcoolizat Serena 1881 0.75l", "q": 2, "cod": "ART_34298"}]}, {"c": "Vodka", "id": "c11", "it": [{"n": "Beluga Transatlantic Vodka 40% Alc. 0.7l + Ochelari Soare", "q": 1, "cod": "ART_35688"}, {"n": "Vodka Absolut Tabasco 38% Alc. 0.7L", "q": 1, "cod": "ART_37628"}, {"n": "Vodka Beluga Noble Winter Edition 40% Alc. 0.7l", "q": 1, "cod": "ART_35667"}]}, {"c": "Whisky", "id": "c12", "it": [{"n": "Whiskey Single Malt Aber Falls 40% Alc. 0.7L", "q": 2, "cod": "ART_36487"}, {"n": "Whisky Single Malt Johnny Cree 40% Alc. 0.7l", "q": 1, "cod": "ART_36509"}]}, {"c": "Vermut", "id": "c13", "it": [{"n": "Vermouth di Torino Rosso Del Professore 18% Alc.", "q": 1, "cod": "ART_38376"}, {"n": "Vermut Rosu Punt E Mes 16% Alc. 1l", "q": 1, "cod": "ART_35699"}]}];
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=d=>d.it.reduce((a,x)=>a+x.q,0);
const T=D.reduce((a,d)=>a+sum(d),0),M=Math.max(...D.map(sum));
document.getElementById('tot').textContent=T;
document.getElementById('np').textContent=D.reduce((a,d)=>a+d.it.length,0);
document.getElementById('nc').textContent=D.length;
document.getElementById('bars').innerHTML=D.map((d,i)=>'<a href="#'+d.id+'">'+esc(d.c)+'</a><div class="bar'+(i===0?' top1':'')+'" style="width:'+(sum(d)/M*100).toFixed(1)+'%"></div><div class="num">'+sum(d)+'</div>').join('');
document.getElementById('grid').innerHTML=D.map(d=>'<section class="cat" id="'+d.id+'"><h2>'+esc(d.c)+'<span>'+sum(d)+' buc</span></h2><ul>'+d.it.map(x=>'<li><b>'+x.q+' ×</b><div>'+esc(x.n)+'<small>'+esc(x.cod)+'</small></div></li>').join('')+'</ul></section>').join('');
}
</script>
</body>
</html>
